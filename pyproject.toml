[project]
name = "bambu-studio-ai"
version = "2.0.0"
description = "Agent skill for Bambu Lab 3D printers: model search, AI generation, printability analysis, multi-color, printer control and monitoring"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Keep CI focused on correctness-critical checks for now.
# Style/import cleanup can be tightened later after formatting the existing codebase.
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # unused imports OK in tests (conftest side effects)

[tool.ruff.lint.isort]
known-first-party = ["colorize", "common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
# Opt-in suites: `pytest -m network` (live services), `pytest -m slicer` (installed Bambu
# Studio), `pytest -m blender` (real Blender renders).
addopts = "-m 'not network and not slicer and not blender'"
markers = [
    "network: talks to real third-party services (opt-in)",
    "slicer: runs the installed Bambu Studio command line (opt-in)",
    "blender: renders with a locally installed Blender (opt-in)",
]

[tool.pyright]
include = ["scripts/bambu_studio_ai"]
strict = ["scripts/bambu_studio_ai"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
extraPaths = ["scripts"]
