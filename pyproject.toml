[project]
name = "bambu-studio-ai"
version = "1.0.2"
description = "Bambu Lab 3D printer control, AI model generation, and multi-color automation"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Keep CI focused on correctness-critical checks for now.
# Style/import cleanup can be tightened later after formatting the existing codebase.
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # unused imports OK in tests (conftest side effects)

[tool.ruff.lint.isort]
known-first-party = ["colorize", "common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
